<!doctype html>
<!-- One camera for CamerasActivity. Live: go2rtc's MSE stream (fMP4 over a WebSocket) in a <video>,
     ~0.3 s behind live, reconnecting on its own. Still: go2rtc's frame.jpeg every few seconds.
     TVs often decode only one video at a time, so only the selected camera is live.
     CamerasActivity fills in GO2RTC, SRC and LIVE and loads it with go2rtc as the base URL,
     because go2rtc only accepts WebSockets from its own origin. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video, img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  #status { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex;
            align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6); font: 400 18px sans-serif; }
</style>
</head>
<body>
<img id="still" alt="">
<video id="video" autoplay muted playsinline></video>
<div id="status">Connecting…</div>
<script>
  var GO2RTC = $GO2RTC, SRC = $SRC, LIVE = $LIVE;
  var STILL_MS = 10000;
  // What this WebView can play; go2rtc picks from these.
  var CODECS = ['avc1.640029', 'avc1.64002A', 'avc1.640033', 'hvc1.1.6.L153.B0', 'mp4a.40.2', 'mp4a.40.5', 'flac', 'opus'];
  var video = document.getElementById('video');
  var still = document.getElementById('still');
  var statusText = document.getElementById('status');
  var session = 0; // bumped on every switch, so callbacks from an old connection do nothing
  var stillTimer = null;

  function showStatus(text) {
    statusText.textContent = text;
    statusText.style.display = text ? 'flex' : 'none';
  }

  // Called from CamerasActivity.
  function setMuted(muted) {
    video.muted = muted;
  }

  function goLive() {
    stop();
    connect(session);
  }

  function goStill() {
    stop();
    refreshStill(session);
  }

  function stop() {
    session++;
    clearTimeout(stillTimer);
    if (video.ws) {
      video.ws.onclose = null;
      video.ws.close();
      video.ws = null;
    }
    // Detach the MediaSource so the TV's decoder is free for the camera going live.
    video.removeAttribute('src');
    video.load();
    video.style.visibility = 'hidden';
  }

  function refreshStill(id) {
    var next = new Image();
    next.onload = function () {
      if (id !== session) return;
      still.src = next.src;
      showStatus('');
      stillTimer = setTimeout(function () { refreshStill(id); }, STILL_MS);
    };
    next.onerror = function () {
      if (id !== session) return;
      if (!still.src) showStatus('Camera offline');
      stillTimer = setTimeout(function () { refreshStill(id); }, STILL_MS);
    };
    next.src = GO2RTC + '/api/frame.jpeg?src=' + encodeURIComponent(SRC) + '&t=' + Date.now();
  }

  video.addEventListener('playing', function () {
    video.style.visibility = 'visible';
    showStatus('');
  });

  function connect(id) {
    if (!still.src) showStatus('Connecting…');
    var ms = new MediaSource();
    var ws = new WebSocket(GO2RTC.replace(/^http/, 'ws') + '/api/ws?src=' + encodeURIComponent(SRC));
    ws.binaryType = 'arraybuffer';
    video.ws = ws;
    var sb = null, pending = [];
    var retry = function (text, why) {
      if (id !== session) return;
      console.log(SRC + ': ' + text + ' (' + why + ')');
      stop();
      showStatus(text);
      var again = session;
      setTimeout(function () { if (again === session) connect(again); }, 5000);
    };
    video.src = URL.createObjectURL(ms);

    ws.onopen = function () {
      ms.addEventListener('sourceopen', function () {
        var supported = CODECS.filter(function (c) {
          return MediaSource.isTypeSupported('video/mp4; codecs="' + c + '"');
        });
        ws.send(JSON.stringify({type: 'mse', value: supported.join(',')}));
      }, {once: true});
    };
    ws.onmessage = function (ev) {
      if (id !== session) return;
      if (typeof ev.data === 'string') {
        var msg = JSON.parse(ev.data);
        if (msg.type === 'mse') {
          sb = ms.addSourceBuffer(msg.value);
          sb.mode = 'segments';
          sb.addEventListener('updateend', onUpdated);
        } else if (msg.type === 'error') {
          retry('Camera offline', msg.value);
        }
        return;
      }
      if (!sb) return;
      pending.push(ev.data);
      feed();
    };
    ws.onclose = function (ev) { retry('Reconnecting…', 'socket closed ' + ev.code); };

    // One append at a time: the next chunk waits for 'updateend'. A big camera (1080p) sends
    // chunks faster than the SourceBuffer finishes some appends.
    function feed() {
      if (id !== session || sb.updating || !pending.length) return;
      if (video.error) {
        retry('Reconnecting…', 'video error ' + video.error.code + ' ' + video.error.message);
        return;
      }
      var data = pending.shift();
      try {
        sb.appendBuffer(data);
      } catch (e) {
        if (e.name !== 'InvalidStateError' || ms.readyState !== 'open') {
          retry('Reconnecting…', e.name + ' ' + e.message);
          return;
        }
        pending.unshift(data); // still busy after all: try again on the next 'updateend'
      }
    }

    function onUpdated() {
      if (id !== session) return;
      if (pending.length) {
        feed();
        return;
      }
      if (!sb.buffered.length) return;
      var end = sb.buffered.end(sb.buffered.length - 1);
      var start = sb.buffered.start(0);
      // Keep only the last few seconds. Stay close to live by playing a little faster: jumping
      // means decoding again from the last keyframe, and doing that on every chunk freezes the picture.
      if (end - start > 10 && !sb.updating) {
        try { sb.remove(start, end - 5); } catch (e) {}
      }
      var gap = end - video.currentTime;
      if (gap > 6) video.currentTime = end - 0.5;
      video.playbackRate = gap > 1 ? 1.25 : gap > 0.5 ? 1.1 : 1;
      if (video.paused) video.play().catch(function () {});
    }

    // Watchdog: data arriving but no new frames means the decoder gave up quietly. (The clock can
    // keep running on the audio alone, so count video frames, not time.)
    var lastFrames = -1;
    var watchdog = setInterval(function () {
      if (id !== session) {
        clearInterval(watchdog);
        return;
      }
      var q = video.getVideoPlaybackQuality();
      var shown = q.totalVideoFrames - q.droppedVideoFrames;
      if (sb && shown === lastFrames) {
        retry('Reconnecting…', 'no new frames: ' + q.totalVideoFrames + ' decoded, ' + q.droppedVideoFrames
            + ' dropped, time ' + video.currentTime.toFixed(1) + ' of ' + (sb.buffered.length ? sb.buffered.end(sb.buffered.length - 1).toFixed(1) : '-')
            + ', ready ' + video.readyState);
      }
      lastFrames = shown;
    }, 6000);
  }

  if (LIVE) goLive();
  else goStill();
</script>
</body>
</html>
